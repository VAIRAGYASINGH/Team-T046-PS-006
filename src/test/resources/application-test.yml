spring:
  application:
    name: upi-payment-switch-test
  datasource:
    url: jdbc:h2:mem:upi_switch_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false # Tests that test flyway directly enable it or run against PostgreSQL Testcontainers

switch:
  input-dir: target/test-input-nonexistent
  output-dir: target/test-output
  timezone: Asia/Kolkata
  limits:
    p2p-txn-cap: 100000.00
    p2m-verified-txn-cap: 200000.00
    p2m-unverified-txn-cap: 100000.00
    daily-debit-amount-cap: 100000.00
    daily-debit-velocity-count: 20
    cooling-period-amount-cap: 5000.00
    cooling-period-hours: 24
    cooling-new-beneficiary-max-txns: 3
    collect-pin-threshold: 2000.00
    collect-max-expiry-minutes: 4320
    timeout-minutes: 30
    tcc-window-calendar-days: 5
    chargeback-window-calendar-days: 45
    dispute-representment-working-days: 5
    dispute-pre-arbitration-calendar-days: 7
