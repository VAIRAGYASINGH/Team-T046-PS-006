spring:
  application:
    name: upi-payment-switch
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upi_switch}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Switch operational and regulatory limits configuration
switch:
  input-dir: ${SWITCH_INPUT_DIR:sample-data}
  output-dir: ${SWITCH_OUTPUT_DIR:output}
  timezone: Asia/Kolkata
  limits:
    p2p-txn-cap: 100000.00
    p2m-verified-txn-cap: 200000.00
    p2m-unverified-txn-cap: 100000.00
    daily-debit-amount-cap: 100000.00
    daily-debit-velocity-count: 20
    cooling-period-amount-cap: 5000.00
    cooling-period-hours: 24
    cooling-new-beneficiary-max-txns: 3
    collect-pin-threshold: 2000.00
    collect-max-expiry-minutes: 4320
    timeout-minutes: 30
    tcc-window-calendar-days: 5
    chargeback-window-calendar-days: 45
    dispute-representment-working-days: 5
    dispute-pre-arbitration-calendar-days: 7

logging:
  level:
    root: INFO
    com.ps006.upiswitch: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

